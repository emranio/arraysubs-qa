<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArraySubs home pitch</title>
<!--
  Homepage hero motion pitch: voiceless, text + flat shapes + flat objects only.
  Desktop 1920x1200; ?layout=phone renders the 1080x1080 phone cut from the same timeline.
  Seekable: window.__seek(t) renders time t; window.__duration is the loop length.
  Rendered frame by frame with ../render.mjs. Storyboard: STORYBOARD.md.
-->
<style>
  @font-face { font-family: 'FD'; src: url('vendor/funnel-display-latin-wght-normal.woff2') format('woff2'); font-weight: 300 800; }
  @font-face { font-family: 'FS'; src: url('vendor/funnel-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 300 800; }

  :root {
    --violet: #7E43F6; --violet-strong: #6A38CF; --tint: #EFE8FE;
    --orange: #FF4D00; --orange-100: #FFE3D5; --orange-text: #A13504;
    --ink: #14100B; --ink-3: #262626; --paper-2: #F2F2F2; --paper-3: #E7E7E7; --line: #DCDCDC;
  }
  html, body { margin: 0; padding: 0; background: #fff; }
  #stage { position: relative; width: 1920px; height: 1200px; overflow: hidden; background: #fff; font-family: 'FS', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  /* Scene layers (discs, objects, chips) keep 1920x1200 coordinates; the phone cut transforms them. */
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; transform-origin: 0 0; }
  svg.layer { overflow: visible; }

  /* Text */
  .line { position: absolute; overflow: hidden; white-space: nowrap; line-height: 0.92; padding: 0.1em 0.06em 0.18em; margin-left: -0.06em; }
  .line.center { left: 0; width: 1920px; text-align: center; margin-left: 0; padding-left: 0; padding-right: 0; }
  .lw { display: inline-block; }
  .w { display: inline-block; will-change: transform; }
  .disp { font-family: 'FD', sans-serif; font-weight: 700; letter-spacing: -0.045em; }
  .sans { font-family: 'FS', sans-serif; }

  #baton { position: absolute; border-radius: 999px; background: var(--violet); transform-origin: 50% 100%; }

  /* Chips and pills (HTML, centred on their left/top point via GSAP xPercent/yPercent) */
  .chip { position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: 14px; white-space: nowrap;
          height: 80px; padding: 0 30px; border-radius: 999px; font: 700 44px/1 'FS', sans-serif; letter-spacing: -0.01em; box-sizing: border-box; }
  .chip svg { width: 40px; height: 40px; flex: none; }
  .num { position: absolute; font: 700 140px/1 'FD', sans-serif; letter-spacing: -0.04em; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .tier { position: absolute; height: 76px; padding: 0 28px; border-radius: 999px; box-sizing: border-box;
          display: inline-flex; align-items: center; font: 700 44px/1 'FS', sans-serif; letter-spacing: 0.09em; transform-origin: 0% 50%; }

  .status { position: absolute; height: 96px; }
  .status .disc { position: absolute; left: 0; top: 0; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box; }
  .status .disc svg { width: 48px; height: 48px; }
  .status .pill { position: absolute; left: 116px; top: 0; height: 96px; border-radius: 999px; box-sizing: border-box; transform-origin: 0% 50%; }
  .status .word { position: absolute; left: 116px; top: 0; height: 96px; padding: 0 36px; display: flex; align-items: center; font: 700 50px/1 'FS', sans-serif; letter-spacing: -0.01em; white-space: nowrap; }

  #ticks { position: absolute; height: 14px; display: flex; gap: 16px; }
  #ticks i { display: block; width: 14px; height: 14px; border-radius: 7px; background: var(--line); flex: none; }
  #ticks i.gap { margin-left: 24px; }

  #dots { position: absolute; width: 148px; height: 80px; }
  #dots i { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #C7AEFB; }
</style>
</head>
<body>
<div id="stage">
  <svg id="ringL" class="layer" viewBox="0 0 1920 1200"></svg>
  <div id="dots"></div>
  <svg id="orangeL" class="layer" viewBox="0 0 1920 1200"></svg>
  <svg id="discL" class="layer" viewBox="0 0 1920 1200"></svg>
  <svg id="objL" class="layer" viewBox="0 0 1920 1200"></svg>
  <div id="chipL" class="layer"></div>
  <svg id="fxL" class="layer" viewBox="0 0 1920 1200"></svg>
  <div id="baton"></div>
  <div id="textL" class="layer"></div>
  <div id="ticks"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="vendor/CustomWiggle.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="vendor/MorphSVGPlugin.min.js"></script>
<script src="vendor/MotionPathPlugin.min.js"></script>
<script src="icons.js"></script>
<script src="pitch.js"></script>
</body>
</html>
